{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Student Complaints</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f7fc;">

<div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:600px;">

        <h3 class="text-center mb-4">Submit Complaint</h3>

        <form method="POST">
            {% csrf_token %}

            <label class="form-label">Send Complaint To</label>
            <select name="complaint_to" class="form-select mb-3" required>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
            </select>

            <label class="form-label">Complaint Subject</label>
            <input type="text" name="subject"
                   class="form-control mb-3" required>

            <label class="form-label">Description</label>
            <textarea name="description"
                      class="form-control mb-3"
                      rows="5" required></textarea>

            <button class="btn btn-primary w-100">
                Submit Complaint
            </button>
        </form>

        <a href="{% url 'student_dashboard' %}"
           class="text-center mt-3">Back to Dashboard</a>

    </div>
</div>

</body>
</html>
