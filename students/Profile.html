<!DOCTYPE html>
<html>
<head>
    <title>My Profile | SmartAttend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f7fc;">

<div class="container mt-5">

    <div class="card shadow-sm p-4 mx-auto"
         style="max-width:550px;border-radius:15px;">

        <h3 class="text-center mb-4">My Profile</h3>

        <div class="text-center mb-4">
            <div style="
                width:80px;
                height:80px;
                background:#e7e1ff;
                color:#7059d9;
                border-radius:50%;
                display:grid;
                place-items:center;
                margin:auto;
                font-size:30px;
                font-weight:bold;">
                {{ student.name|first|upper }}
            </div>
        </div>

        <p><b>Student Name:</b> {{ student.name }}</p>
        <p><b>PIN Number:</b> {{ student.pin }}</p>
        <p><b>Branch:</b> {{ student.branch }}</p>
        <p><b>Section:</b> {{ student.section }}</p>

        <a href="{% url 'student_dashboard' %}"
           class="btn btn-primary mt-3">
            Back to Dashboard
        </a>

    </div>

</div>
</body>
</html>
