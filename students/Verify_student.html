<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Verification | SmartAttend</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg,#f0f4ff,#f9f5ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial,sans-serif;
        }

        .verify-card {
            background: white;
            width: 420px;
            max-width: 92%;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #00000010;
        }

        .verify-card h3 {
            color: #6555c9;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .verify-btn {
            background: #7059d9;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            margin-top: 15px;
        }

        .verify-btn:hover {
            background: #5744bd;
        }
    </style>
</head>

<body>

<div class="verify-card">

    <div class="text-center mb-4">
        <h3>SmartAttend</h3>
        <p class="text-muted">Student Profile Verification</p>
    </div>

    <form method="POST" action="{% url 'student_verify' %}">
        {% csrf_token %}

        <label class="form-label">Student PIN Number</label>
        <input type="text" name="pin"
               class="form-control mb-3"
               placeholder="Enter your PIN"
               required>

        <label class="form-label">Branch</label>
        <select name="branch" class="form-select mb-3" required>
            <option value="">Select Branch</option>
            <option value="CME">CME</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
        </select>

        <label class="form-label">Section</label>
        <select name="section" class="form-select mb-3" required>
            <option value="">Select Section</option>
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
        </select>

        <button type="submit" class="verify-btn">
            Verify & Continue
        </button>
    </form>

</div>

</body>
</html>
