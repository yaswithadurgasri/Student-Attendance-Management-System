
<div class="table-responsive">
<table class="table table-hover">
<thead><tr><th>Roll No.</th><th>Name</th><th>Department</th><th>Year</th><th>Actions</th></tr></thead>
<tbody>
{% for s in students %}
<tr>
<td>{{ s.roll_number }}</td>
<td>{{ s.name }}</td>
<td>{{ s.department }}</td>
<td>{{ s.year }}</td>
<td>
<a class="btn btn-sm btn-outline-primary" href="{% url 'dashboard_edit' 'student' s.pk %}">Edit</a>
<a class="btn btn-sm btn-outline-danger" href="{% url 'dashboard_delete' 'student' s.pk %}">Delete</a>
</td>
</tr>
{% empty %}
<tr><td colspan="5" class="text-center text-muted">No students added yet.</td></tr>
{% endfor %}
</tbody></table></div>
