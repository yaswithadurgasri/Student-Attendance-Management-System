
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ page_title }} - SmartAttend</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'staff/staff.css' %}">
</head>

<body>
<div class="container py-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:650px;">
        <h3>{{ page_title }}</h3>
        <p>Enter the student details below.</p>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <small class="text-danger">{{ error }}</small>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary">
                Save Student
            </button>

            <a href="{% url 'staff:dashboard' %}"
               class="btn btn-light">
                Cancel
            </a>
        </form>
    </div>
</div>
</body>
              </html>
