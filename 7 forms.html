
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartAttend | Manage Record</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f6f7fc;font-family:Arial,sans-serif}
.card{max-width:650px;margin:55px auto;border:0;border-radius:16px}
.btn-purple{background:#6b5bd2;color:white;border:0}
.btn-purple:hover{background:#5545b7;color:white}
</style>
</head>
<body>
<div class="container">
<div class="card shadow-sm p-4">
<h3 class="mb-2">{{ title }}</h3>
<p class="text-muted">Enter the details below.</p>

<form method="POST">
{% csrf_token %}
{{ form.as_p }}
<button type="submit" class="btn btn-purple">Save</button>
<a href="{% url 'dashboard_home' %}" class="btn btn-light">Cancel</a>
</form>
</div>
</div>
</body>
</html>
