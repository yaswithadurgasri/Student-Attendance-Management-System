
<div class="table-responsive">
<table class="table table-hover">
<thead><tr><th>Department</th><th>Code</th><th>Actions</th></tr></thead>
<tbody>
{% for d in departments %}
<tr>
<td>{{ d.name }}</td>
<td>{{ d.code }}</td>
<td>
<a class="btn btn-sm btn-outline-primary" href="{% url 'dashboard_edit' 'department' d.pk %}">Edit</a>
<a class="btn btn-sm btn-outline-danger" href="{% url 'dashboard_delete' 'department' d.pk %}">Delete</a>
</td>
</tr>
{% empty %}
<tr><td colspan="3" class="text-center text-muted">No departments added yet.</td></tr>
{% endfor %}
</tbody></table></div>
