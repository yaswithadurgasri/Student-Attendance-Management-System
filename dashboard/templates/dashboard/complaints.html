
<div class="table-responsive">
<table class="table table-hover">
<thead><tr><th>Title</th><th>Submitted By</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>
{% for c in complaints %}
<tr>
<td>{{ c.title }}</td>
<td>{{ c.submitted_by }}</td>
<td>{{ c.category }}</td>
<td><span class="badge badge-soft">{{ c.status }}</span></td>
<td>
<a class="btn btn-sm btn-outline-primary" href="{% url 'dashboard_edit' 'complaint' c.pk %}">Update</a>
<a class="btn btn-sm btn-outline-danger" href="{% url 'dashboard_delete' 'complaint' c.pk %}">Delete</a>
</td>
</tr>
{% empty %}
<tr><td colspan="5" class="text-center text-muted">No complaints yet.</td></tr>
{% endfor %}
</tbody></table></div>
