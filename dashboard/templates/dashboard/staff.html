
<div class="table-responsive">
<table class="table table-hover">
<thead><tr><th>Staff ID</th><th>Name</th><th>Department</th><th>Actions</th></tr></thead>
<tbody>
{% for s in staff_members %}
<tr>
<td>{{ s.staff_id }}</td>
<td>{{ s.name }}</td>
<td>{{ s.department }}</td>
<td>
<a class="btn btn-sm btn-outline-primary" href="{% url 'dashboard_edit' 'staff' s.pk %}">Edit</a>
<a class="btn btn-sm btn-outline-danger" href="{% url 'dashboard_delete' 'staff' s.pk %}">Delete</a>
</td>
</tr>
{% empty %}
<tr><td colspan="4" class="text-center text-muted">No staff added yet.</td></tr>
{% endfor %}
</tbody></table></div>
