
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Delete</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f6f7fc;font-family:Arial,sans-serif}
.card{max-width:450px;margin:100px auto;border:0;border-radius:16px}
</style>
</head>
<body>
<div class="container">
<div class="card shadow-sm p-4 text-center">
<h4>Delete this record?</h4>
<p class="text-muted">Are you sure you want to delete this record? This action cannot be undone.</p>
<form method="POST">
{% csrf_token %}
<button type="submit" class="btn btn-danger">Yes, Delete</button>
<a href="{% url 'dashboard_home' %}" class="btn btn-light">Cancel</a>
</form>
</div>
</div>
</body>
  </html>
