
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SmartAttend | Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
 --blue:#4776f5;
 --purple:#9b25e9;
 --ink:#202434;
 --muted:#858b9b;
 --line:#eceef5;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#f2f3ff;
 color:var(--ink);
 font-family:Inter,system-ui,Arial,sans-serif;
}

.sidebar{
 position:fixed;
 inset:0 auto 0 0;
 width:250px;
 background:#fff;
 border-right:1px solid var(--line);
 padding:22px 15px;
 z-index:20;
 overflow:auto;
 transition:.25s;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 padding:0 10px 25px;
 font-size:21px;
 font-weight:800;
}

.logo{
 width:42px;
 height:42px;
 border-radius:50%;
 display:grid;
 place-items:center;
 color:#fff;
 background:linear-gradient(135deg,#4776ff,#a21bef);
 font-size:22px;
}

.nav-label{
 font-size:10px;
 letter-spacing:1.4px;
 color:#a0a5b2;
 font-weight:800;
 padding:13px 12px 7px;
}

.navlink{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 border-radius:12px;
 color:#717789;
 font-size:13px;
 font-weight:650;
 text-decoration:none;
 cursor:pointer;
 margin:3px 0;
}

.navlink i{
 font-size:17px;
 width:20px;
}

.navlink.active,
.navlink:hover{
 background:#eff2ff;
 color:#4268ed;
}

.main{
 margin-left:250px;
 padding:25px 28px;
 max-width:1700px;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 margin-bottom:24px;
}

.title{
 font-size:25px;
 font-weight:800;
 margin:0;
}

.muted{
 font-size:12px;
 color:var(--muted);
 margin-top:5px;
}

.iconbtn{
 width:40px;
 height:40px;
 border:1px solid var(--line);
 border-radius:12px;
 background:#fff;
 color:#626b7d;
}

.admin{
 display:flex;
 align-items:center;
 gap:9px;
 border:1px solid var(--line);
 border-radius:13px;
 padding:4px 10px 4px 4px;
 background:#fff;
 font-size:12px;
 font-weight:700;
}

.avatar{
 width:34px;
 height:34px;
 border-radius:10px;
 background:linear-gradient(135deg,#4776ff,#a21bef);
 color:#fff;
 display:grid;
 place-items:center;
}

.welcome,.panel,.stat{
 background:#fff;
 border:1px solid var(--line);
 border-radius:17px;
 box-shadow:0 4px 18px #22305a08;
}

.welcome{
 padding:22px 25px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:linear-gradient(110deg,#fff 65%,#f1edff);
 margin-bottom:20px;
}

.welcome h2{
 font-size:21px;
 font-weight:800;
 margin:0 0 7px;
}

.welcome p{
 color:var(--muted);
 font-size:13px;
 margin:0;
}

.welcome-icon{
 width:70px;
 height:70px;
 border-radius:22px;
 background:linear-gradient(135deg,#4776ff,#a21bef);
 display:grid;
 place-items:center;
 color:white;
 font-size:30px;
}

.stat{
 padding:16px;
 height:100%;
}

.stathead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 color:var(--muted);
 font-size:12px;
 font-weight:650;
}

.staticon{
 width:36px;
 height:36px;
 border-radius:11px;
 display:grid;
 place-items:center;
 font-size:18px;
}

.blue{
 background:#edf2ff;
 color:#4b70f5;
}

.green{
 background:#e7faf2;
 color:#18a875;
}

.orange{
 background:#fff4e7;
 color:#ed9630;
}

.purple{
 background:#f5eaff;
 color:#932ce2;
}

.number{
 font-size:27px;
 font-weight:800;
 margin-top:9px;
}

.sub{
 font-size:11px;
 color:var(--muted);
 margin-top:4px;
}

.section-title{
 font-size:15px;
 font-weight:800;
 margin:24px 0 12px;
}

.panel{
 padding:18px;
 height:100%;
}

.panelhead{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:start;
 margin-bottom:15px;
}

.panel h3{
 font-size:14px;
 font-weight:800;
 margin:0;
}

.hint{
 font-size:11px;
 color:var(--muted);
 margin-top:4px;
}

.chart{
 height:230px;
 position:relative;
}

.chart.donut{
 height:205px;
}

.progress{
 height:8px;
 background:#f0f1f7;
 border-radius:10px;
}

.progress-bar{
 background:linear-gradient(90deg,#4776f5,#8b35ed);
 border-radius:10px;
}

.deptrow{
 display:grid;
 grid-template-columns:95px 1fr 34px;
 align-items:center;
 gap:9px;
 margin:16px 0;
 font-size:12px;
}

.deptrow strong{
 font-size:11px;
 text-align:right;
 color:#72798a;
}

.heatmap{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:6px;
}

.heatmap span{
 aspect-ratio:1;
 border-radius:5px;
 background:#e8edff;
}

.heatmap span:nth-child(3n){
 background:#c4d0ff;
}

.heatmap span:nth-child(4n){
 background:#96adff;
}

.heatmap span:nth-child(5n){
 background:#6486f5;
}

.weekday{
 text-align:center;
 color:#9298a7;
 font-size:10px;
}

.activity{
 display:flex;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #f0f1f6;
 font-size:12px;
}

.activity:last-child{
 border:0;
}

.activity .desc{
 font-weight:700;
}

.activity small{
 display:block;
 color:var(--muted);
 margin-top:4px;
}

.badge-soft{
 font-size:10px;
 font-weight:750;
 padding:5px 8px;
 border-radius:7px;
 white-space:nowrap;
}

.open{
 background:#fff2df;
 color:#b76b0c;
}

.progressing{
 background:#edf2ff;
 color:#4568e8;
}

.resolved{
 background:#e6faf1;
 color:#16875e;
}

.gradient{
 border:0;
 border-radius:10px;
 color:#fff;
 background:linear-gradient(100deg,#4776f5,#a11be8);
 font-size:12px;
 font-weight:750;
 padding:9px 13px;
}

.outline{
 border:1px solid #e7e9f2;
 border-radius:9px;
 background:#fff;
 color:#5c6579;
 padding:7px 10px;
 font-size:11px;
}

.table{
 font-size:12px;
 vertical-align:middle;
}

.table th{
 color:#858b9b;
 font-size:10px;
 text-transform:uppercase;
 letter-spacing:.5px;
}

.table td,.table th{
 padding:12px 10px;
 border-color:#f0f1f6;
}

.page{
 display:none;
}

.page.active{
 display:block;
}

.search{
 border:1px solid var(--line);
 border-radius:10px;
 padding:9px 12px;
 font-size:12px;
 min-width:190px;
}

.form-control,.form-select{
 font-size:13px;
 border-radius:10px;
}

.mobiletoggle{
 display:none;
}

.overlay{
 display:none;
}

@media(max-width:767px){

 .sidebar{
  transform:translateX(-110%);
  width:270px;
 }

 .sidebar.open{
  transform:translateX(0);
  box-shadow:15px 0 45px #1e2a4a20;
 }

 .overlay.show{
  display:block;
  position:fixed;
  inset:0;
  background:#1b244455;
  z-index:19;
 }

 .main{
  margin:0;
  padding:16px 13px;
 }

 .title{
  font-size:21px;
 }

 .mobiletoggle{
  display:inline-block;
 }

 .adminlabel{
  display:none;
 }

 .welcome{
  padding:18px;
 }

 .welcome-icon{
  width:55px;
  height:55px;
  font-size:24px;
 }

 .stat{
  padding:13px;
 }

 .number{
  font-size:23px;
 }

 .panel{
  padding:14px;
 }

 .chart{
  height:220px;
 }

 .search{
  min-width:0;
  width:100%;
 }
}

@media print{

 .sidebar,.topbar button,.gradient,.outline{
  display:none!important;
 }

 .main{
  margin:0;
  padding:0;
 }

 .page{
  display:none!important;
 }

 #overview{
  display:block!important;
 }

 body{
  background:#fff;
 }
}

</style>
</head>
