
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center">Student Dashboard</h2>

        <h5 class="mt-3">
            Welcome, {{ request.user.username }}!
        </h5>

        <!-- Attendance Notification -->
        <div id="notification" class="alert alert-info mt-4">
            Checking for active attendance...
        </div>

        <!-- Open Notification Button -->
        <button id="openBtn" class="btn btn-primary w-100" disabled>
            Open QR Notification
        </button>

        <!-- QR Notification Section -->
        <div id="qrSection" class="card mt-4 p-3 text-center" style="display:none;">

            <h5>Attendance QR Notification</h5>

            <p id="subjectName" class="text-primary fw-bold"></p>

            <img id="qrImage" src="" class="img-fluid mx-auto"
                 style="max-width:220px;" alt="Attendance QR Code">

            <button id="markBtn" class="btn btn-success w-100 mt-3">
                Mark Attendance
            </button>

        </div>

        <!-- Result -->
        <div id="result" class="mt-3"></div>

    </div>
</div>

{% csrf_token %}

<script>

const notification = document.getElementById("notification");
const openBtn = document.getElementById("openBtn");
const qrSection = document.getElementById("qrSection");
const qrImage = document.getElementById("qrImage");
const subjectName = document.getElementById("subjectName");
const markBtn = document.getElementById("markBtn");
const result = document.getElementById("result");

let currentSessionId = null;
let currentQrData = null;
let alreadyMarked = false;

// Check active attendance
async function checkAttendance() {

    try {

        const response = await fetch(
            "{% url 'attendance:active_attendance' %}"
        );

        const data = await response.json();

        if (data.active) {

            currentSessionId = data.session_id;
            alreadyMarked = data.already_marked;

            notification.className = "alert alert-warning mt-4";

            notification.innerHTML =
                "Attendance is active for: " + data.subject;

            openBtn.disabled = alreadyMarked;

            if (alreadyMarked) {

                notification.className = "alert alert-success mt-4";
                notification.innerHTML =
                    "Your attendance is already marked!";

                qrSection.style.display = "none";

            }

        } else {

            currentSessionId = null;
            currentQrData = null;

            notification.className = "alert alert-info mt-4";
            notification.innerHTML =
                "No active attendance right now.";

            openBtn.disabled = true;
            qrSection.style.display = "none";

        }

    } catch (error) {

        notification.innerHTML =
            "Unable to check attendance.";

    }
}


// Open QR Notification
openBtn.addEventListener("click", async function () {

    try {

        const response = await fetch(
            "{% url 'attendance:active_attendance' %}"
        );

        const data = await response.json();

        if (!data.active || data.already_marked) {
            result.innerHTML =
                '<div class="alert alert-warning">Attendance is unavailable or already marked.</div>';
            await checkAttendance();
            return;
        }

        if (data.session_id !== currentSessionId) {
            currentSessionId = data.session_id;
        }

        const qrResponse = await fetch(
            "{% url 'attendance:get_active_qr' %}"
        );

        const qrData = await qrResponse.json();

        if (!qrResponse.ok) {
            result.innerHTML =
                '<div class="alert alert-danger">' +
                (qrData.error || "Unable to load QR code.") +
                '</div>';
            return;
        }

        currentQrData = qrData.qr_data;

        subjectName.innerHTML =
            "Subject: " + data.subject;

        qrImage.src = qrData.qr_code;

        qrSection.style.display = "block";

        result.innerHTML = "";

    } catch (error) {

        result.innerHTML =
            '<div class="alert alert-danger">Unable to open QR notification.</div>';

    }

});


// Mark Attendance
markBtn.addEventListener("click", async function () {

    if (!currentQrData) {
        result.innerHTML =
            '<div class="alert alert-warning">Please open the QR notification first.</div>';
        return;
    }

    markBtn.disabled = true;

    try {

        const csrfToken = document.querySelector(
            '[name="csrfmiddlewaretoken"]'
        ).value;

        const formData = new FormData();

        formData.append("qr_data", currentQrData);

        const response = await fetch(
            "{% url 'attendance:mark_qr_attendance' %}",
            {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken
                },
                body: formData
            }
        );

        const data = await response.json();

        if (response.ok && data.success) {

            result.innerHTML =
                '<div class="alert alert-success">' +
                data.message +
                '</div>';

            qrSection.style.display = "none";

        } else {

            result.innerHTML =
                '<div class="alert alert-danger">' +
                (data.message || data.error || "Attendance failed.") +
                '</div>';

            markBtn.disabled = false;

        }

        await checkAttendance();

    } catch (error) {

        result.innerHTML =
            '<div class="alert alert-danger">Unable to mark attendance.</div>';

        markBtn.disabled = false;

    }

});


// Check every 5 seconds
checkAttendance();
setInterval(checkAttendance, 5000);

</script>

</body>
</html>
