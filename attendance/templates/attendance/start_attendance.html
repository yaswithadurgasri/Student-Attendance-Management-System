
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow mx-auto p-4" style="max-width: 500px;">
        <h2 class="text-center mb-4">QR Attendance</h2>

        <form id="attendanceForm">
            {% csrf_token %}
            <label for="subject" class="form-label">Subject Name</label>
            <input type="text" id="subject" name="subject"
                   class="form-control mb-3"
                   placeholder="Enter subject name" required>

            <button type="submit" class="btn btn-primary w-100">
                Start Attendance
            </button>
        </form>

        <p id="message" class="mt-3 text-center"></p>

        <div id="qrContainer" class="text-center mt-3"></div>
    </div>
</div>

<script>
const form = document.getElementById("attendanceForm");
const message = document.getElementById("message");
const qrContainer = document.getElementById("qrContainer");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.textContent = "Starting attendance...";
    qrContainer.innerHTML = "";

    const formData = new FormData(form);

    try {
        const response = await fetch("{% url 'attendance:start_attendance' %}", {
            method: "POST",
            body: formData,
            headers: {
                "X-CSRFToken": formData.get("csrfmiddlewaretoken")
            },
            credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not start attendance.");
        }

        message.textContent = data.message;

        const image = document.createElement("img");
        image.src = data.qr_code;
        image.alt = "Attendance QR Code";
        image.width = 250;
        image.className = "img-fluid";

        qrContainer.appendChild(image);
    } catch (error) {
        message.textContent = error.message;
    }
});
</script>

</body>
</html>
