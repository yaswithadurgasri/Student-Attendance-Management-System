
<div class="table-responsive">
<table class="table table-hover">
<thead><tr><th>Student</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>
{% for a in attendance_records %}
<tr>
<td>{{ a.student }}</td>
<td>{{ a.date }}</td>
<td><span class="badge badge-soft">{{ a.status }}</span></td>
<td>
<a class="btn btn-sm btn-outline-primary" href="{% url 'dashboard_edit' 'attendance' a.pk %}">Edit</a>
<a class="btn btn-sm btn-outline-danger" href="{% url 'dashboard_delete' 'attendance' a.pk %}">Delete</a>
</td>
</tr>
{% empty %}
<tr><td colspan="4" class="text-center text-muted">No attendance records yet.</td></tr>
{% endfor %}
</tbody></table></div>
